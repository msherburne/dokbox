name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true

permissions:
  contents: write

jobs:
  build-linux-standalone:
    name: Build Linux standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: GOARCH=amd64 ./packaging/build-linux.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-standalone-amd64
          path: |
            dist/dokbox-linux-*.tar.gz

  build-linux-packages:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm pacman-package-manager libarchive-tools fakeroot zstd zip

      - name: Build packages
        run: |
          GOARCH=amd64 ./packaging/build-deb.sh
          GOARCH=amd64 ./packaging/build-rpm.sh
          GOARCH=amd64 ./packaging/build-pacman.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  build-macos:
    name: Build macOS standalone (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: GOARCH=${{ matrix.goarch }} ./packaging/build-darwin.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: darwin-standalone-${{ matrix.goarch }}
          path: |
            dist/dokbox-darwin-*.tar.gz

  build-windows:
    name: Build Windows standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build
        run: GOARCH=amd64 ./packaging/build-windows.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-standalone-amd64
          path: |
            dist/dokbox-windows-*.zip

  release-assets:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs:
      - build-linux-standalone
      - build-linux-packages
      - build-macos
      - build-windows
    env:
      RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Collect release files
        run: |
          mkdir -p dist
          find dist/artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} dist/ \;

      - name: Resolve release version
        run: |
          if [ -n "${RELEASE_INPUT_VERSION}" ]; then
            version="${RELEASE_INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Generate metadata assets
        run: |
          VERSION="$VERSION" ./packaging/release-manifest.sh
          VERSION="$VERSION" ./packaging/generate-homebrew-formula.sh
          VERSION="$VERSION" ./packaging/generate-winget-manifest.sh
          cp "dist/dokbox_${VERSION}-1_amd64.deb" dist/dokbox-linux-amd64.deb
          cp "dist/dokbox-${VERSION}-1.x86_64.rpm" dist/dokbox-linux-x86_64.rpm
          cp "dist/dokbox-${VERSION}-1-x86_64.pkg.tar.zst" dist/dokbox-linux-x86_64.pkg.tar.zst
          (
            cd dist
            zip -rq dokbox-winget-manifests.zip winget
          )
          cp install/install.sh dist/install.sh
          cp install/install.ps1 dist/install.ps1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/install.sh
            dist/install.ps1
            dist/release-manifest.json
            dist/dokbox.rb
